# CI-Gate — spiegelt das lokale „Gate vor fertig" (CLAUDE.md):
#   npm run check (svelte-check + Drift-Checks) · lint · vitest · build
#
# Drift-Checks: ALLE ACHT laufen seit PR 8 mit `--strict` und blockieren bei
# Befund (nav, tokens, assets, component-drift, content, doc-coverage, zds-sync,
# token-refs). Die frühere Sammel-Ausnahme (`check-doc-coverage` im Warn-Modus
# wegen einer Lücke bei `cell`) ist ersetzt durch EINZELNE, begründete Ausnahmen
# in der AUSNAHMEN-Tabelle von tooling/check-doc-coverage.mjs — sichtbar bei
# jedem Lauf und selbst geprüft: eine Ausnahme ohne Befund bricht den Check.
#
# `npm run lint` läuft mit `--max-warnings 0`. Die früheren 27 Warnungen waren
# EIN Befund in 27 Dateien: eslint-plugin-svelte kompiliert für `valid-compile`
# hart mit `customElement: true` und meldet darum jedes `$props()` mit
# Rest-Element — in einer App, die keine Svelte-Custom-Elements baut, ist das
# konstruktionsbedingt unerfüllbar. Gefiltert wird jetzt an der Quelle (`onwarn`
# in apps/docs/svelte.config.js, in ESLint durchgereicht über
# parserOptions.svelteConfig) — nicht per eslint-disable, und nur diese eine
# Warnung: a11y_*, css_unused_selector & Co. schlagen weiter durch. Ein Test hält
# die Voraussetzung fest (apps/docs/svelte.config.test.ts).
name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Dummy-Credentials NUR für den CI-Build (der Build verlangt USERS);
      # echte Zugänge leben ausschließlich in den Vercel-Env-Vars.
      USERS: '[{"username":"ci","password":"ci-only"}]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check (svelte-check + Drift)
        run: npm run check

      - name: Lint
        run: npm run lint

      # Die Suite läuft im Workspace `docs` (dort liegt seit PR 3 die vite/vitest-
      # Config); `npm test` delegiert dorthin und sammelt tooling/ + packages/ mit ein.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # E2E (Playwright): CMS-Kernflüsse, MCP/llms.txt, **visuelle Regression**
  # (Screenshot-Snapshots, hell + dunkel) und **A11y** (axe-core, WCAG 2.0/2.1 A+AA).
  # Läuft mit den committeten Hooks (Basic-Auth aktiv) — die Tests
  # authentifizieren sich mit den Dummy-USERS via httpCredentials
  # (playwright.config.ts).
  #
  # Snapshot-Hinweis: Die Referenzbilder liegen plattformgetrennt unter
  # apps/docs/e2e/__screenshots__/<platform>/. CI vergleicht gegen `linux`; lokal auf macOS
  # entsteht `darwin`. Ein Snapshot-Fehlschlag lädt unten den HTML-Report als
  # Artefakt hoch (erwartet/aktuell/diff) — sonst ist er nicht diagnostizierbar.
  e2e:
    runs-on: ubuntu-latest
    env:
      USERS: '[{"username":"ci","password":"ci-only"}]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium

      - name: E2E (Smoke + Visuelle Regression + A11y)
        run: npm run test:e2e

      # Bei Fehlschlag: Report + Diff-Bilder sichern. `if: failure()` — im
      # Grünfall gibt es nichts zu holen.
      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/docs/playwright-report/
          retention-days: 14

      # Die rohen Artefakte enthalten die *-actual.png / *-diff.png je Fehlschlag —
      # damit lässt sich ein Snapshot-Bruch ohne lokalen Nachbau beurteilen.
      - name: Test-Artefakte hochladen (Screenshots/Diffs/Traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/docs/test-results/
          retention-days: 14
